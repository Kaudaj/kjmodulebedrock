services:
  _defaults:
    public: true

  kaudaj.module.module_bedrock.form.type.general:
    class: Kaudaj\Module\ModuleBedrock\Form\Type\GeneralType
    parent: form.type.translatable.aware
    public: true
    tags:
      - { name: form.type }

  kaudaj.module.module_bedrock.form.configuration.general:
    class: Kaudaj\Module\ModuleBedrock\Form\Configuration\GeneralConfiguration
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@prestashop.adapter.shop.context'
      - '@prestashop.adapter.multistore_feature'

  kaudaj.module.module_bedrock.form.data_provider.general:
    class: Kaudaj\Module\ModuleBedrock\Form\DataProvider\GeneralFormDataProvider
    arguments:
      - '@kaudaj.module.module_bedrock.form.configuration.general'

  kaudaj.module.module_bedrock.form.data_handler.general:
    class: 'PrestaShop\PrestaShop\Core\Form\Handler'
    arguments:
      - '@form.factory'
      - '@prestashop.core.hook.dispatcher'
      - '@kaudaj.module.module_bedrock.form.data_provider.general'
      - 'Kaudaj\Module\ModuleBedrock\Form\Type\GeneralType'
      - 'General'
